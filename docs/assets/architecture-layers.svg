<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14070D"/>
      <stop offset="100%" stop-color="#220D17"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F43F5E"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="860" rx="18" fill="url(#bgGrad)"/>

  <!-- Header -->
  <rect x="28" y="22" width="1144" height="62" rx="12" fill="#2A111C" stroke="#5B243A" stroke-width="1.2"/>
  <rect x="28" y="22" width="8" height="62" rx="4" fill="url(#roseGrad)"/>
  <text x="52" y="49" fill="#FFEAF1" font-size="21" font-weight="700">Elfy — Hexagonal (Ports &amp; Adapters) 6-Layer Architecture</text>
  <text x="52" y="70" fill="#D4A6B8" font-size="13">Strict inward dependency rule: UI -&gt; Hooks -&gt; Ports &lt;- Adapters -&gt; Domain/Utils, backed by Dual Runtime (Tauri v2 Rust vs Browser/Playwright)</text>

  <!-- Layer 5: Presentation & UI -->
  <rect x="28" y="102" width="820" height="122" rx="12" fill="#27111B" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="46" y="125" fill="#FF7997" font-size="13" font-weight="700">LAYER 5 · PRESENTATION &amp; UI  (src/App.tsx, src/pages/, src/components/, src/styles/)</text>
  <rect x="46" y="138" width="250" height="72" rx="8" fill="#180910" stroke="#4D2033"/>
  <text x="58" y="158" fill="#FFEAF1" font-size="12.5" font-weight="700">Router &amp; Pages</text>
  <text x="58" y="176" fill="#D4A6B8" font-size="11">HashRouter: #/ FriendHubsPage</text>
  <text x="58" y="192" fill="#D4A6B8" font-size="11">#/stream StreamViewerPage | #/register</text>

  <rect x="312" y="138" width="338" height="72" rx="8" fill="#180910" stroke="#4D2033"/>
  <text x="324" y="158" fill="#FFEAF1" font-size="12.5" font-weight="700">UI Components (12 Modules)</text>
  <text x="324" y="176" fill="#D4A6B8" font-size="11">FriendHubs, ChooseNickname, MultiStreamHub,</text>
  <text x="324" y="192" fill="#D4A6B8" font-size="11">StreamTile, BottomDock, FullscreenStreamViewer, Alerts</text>

  <rect x="666" y="138" width="166" height="72" rx="8" fill="#180910" stroke="#4D2033"/>
  <text x="678" y="158" fill="#FFEAF1" font-size="12.5" font-weight="700">Elfy Rose Theme</text>
  <text x="678" y="176" fill="#D4A6B8" font-size="11">styles/theme.css</text>
  <text x="678" y="192" fill="#D4A6B8" font-size="11">CSS Modules + Vars</text>

  <!-- Arrow L5 -> L4 -->
  <line x1="438" y1="224" x2="438" y2="250" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- Layer 4: Application Hooks -->
  <rect x="28" y="252" width="820" height="106" rx="12" fill="#251324" stroke="#C084FC" stroke-width="1.5"/>
  <text x="46" y="275" fill="#D8B4FE" font-size="13" font-weight="700">LAYER 4 · APPLICATION ORCHESTRATION HOOKS  (src/hooks/)</text>

  <rect x="46" y="287" width="246" height="58" rx="8" fill="#180B19" stroke="#4B2852"/>
  <text x="58" y="307" fill="#FFEAF1" font-size="12.5" font-weight="700">useProfile()</text>
  <text x="58" y="325" fill="#D4A6B8" font-size="11">UID, SQLite init, GA4 consent, Bus sync</text>

  <rect x="308" y="287" width="256" height="58" rx="8" fill="#180B19" stroke="#4B2852"/>
  <text x="320" y="307" fill="#FFEAF1" font-size="12.5" font-weight="700">useFriendHubsDiscovery()</text>
  <text x="320" y="325" fill="#D4A6B8" font-size="11">/probe status, background /knock + toast</text>

  <rect x="580" y="287" width="252" height="58" rx="8" fill="#180B19" stroke="#4B2852"/>
  <text x="592" y="307" fill="#FFEAF1" font-size="12.5" font-weight="700">useRoomSession()</text>
  <text x="592" y="325" fill="#D4A6B8" font-size="11">Knock gate, mesh peers, DataChannel, 2s loop</text>

  <!-- Arrow L4 -> L3 -->
  <line x1="438" y1="358" x2="438" y2="384" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Layer 3: Hexagonal Ports -->
  <rect x="28" y="386" width="820" height="82" rx="12" fill="#13222F" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="46" y="408" fill="#7DD3FC" font-size="13" font-weight="700">LAYER 3 · HEXAGONAL PORT INTERFACES  (src/ports/index.ts)</text>
  <rect x="46" y="420" width="122" height="36" rx="6" fill="#0B1620" stroke="#255473"/>
  <text x="107" y="442" text-anchor="middle" fill="#E0F2FE" font-size="11" font-weight="600">IStorageRepository</text>
  <rect x="178" y="420" width="126" height="36" rx="6" fill="#0B1620" stroke="#255473"/>
  <text x="241" y="442" text-anchor="middle" fill="#E0F2FE" font-size="11" font-weight="600">ISignalingTransport</text>
  <rect x="314" y="420" width="112" height="36" rx="6" fill="#0B1620" stroke="#255473"/>
  <text x="370" y="442" text-anchor="middle" fill="#E0F2FE" font-size="11" font-weight="600">IStreamEngine</text>
  <rect x="436" y="420" width="120" height="36" rx="6" fill="#0B1620" stroke="#255473"/>
  <text x="496" y="442" text-anchor="middle" fill="#E0F2FE" font-size="11" font-weight="600">ISystemMonitor</text>
  <rect x="566" y="420" width="130" height="36" rx="6" fill="#0B1620" stroke="#255473"/>
  <text x="631" y="442" text-anchor="middle" fill="#E0F2FE" font-size="11" font-weight="600">ITelemetryProvider</text>
  <rect x="706" y="420" width="126" height="36" rx="6" fill="#0B1620" stroke="#255473"/>
  <text x="769" y="442" text-anchor="middle" fill="#E0F2FE" font-size="11" font-weight="600">ILocalWindowBus</text>

  <!-- Arrow L2 -> L3 (implements) -->
  <line x1="438" y1="496" x2="438" y2="470" stroke="#10B981" stroke-width="2" marker-end="url(#arrowEmerald)"/>

  <!-- Layer 2: Infrastructure Adapters -->
  <rect x="28" y="498" width="820" height="176" rx="12" fill="#11241E" stroke="#10B981" stroke-width="1.5"/>
  <text x="46" y="521" fill="#6EE7B7" font-size="13" font-weight="700">LAYER 2 · INFRASTRUCTURE ADAPTERS  (src/adapters/index.ts — Dual Runtime Selection)</text>

  <rect x="46" y="534" width="250" height="58" rx="8" fill="#0B1914" stroke="#1F5944"/>
  <text x="58" y="553" fill="#ECFDF5" font-size="12" font-weight="700">storageRepository.ts</text>
  <text x="58" y="570" fill="#A7F3D0" font-size="10.8">Tauri: SqliteStorageRepository (db_*)</text>
  <text x="58" y="584" fill="#A7F3D0" font-size="10.8">Web: TestFallbackStorage (localStorage)</text>

  <rect x="312" y="534" width="256" height="58" rx="8" fill="#0B1914" stroke="#1F5944"/>
  <text x="324" y="553" fill="#ECFDF5" font-size="12" font-weight="700">mqttSignalingAdapter.ts</text>
  <text x="324" y="570" fill="#A7F3D0" font-size="10.8">EMQX wss://broker.emqx.io:8084/mqtt</text>
  <text x="324" y="584" fill="#A7F3D0" font-size="10.8">+ BroadcastChannel('elfy_test_signaling_bus')</text>

  <rect x="584" y="534" width="248" height="58" rx="8" fill="#0B1914" stroke="#1F5944"/>
  <text x="596" y="553" fill="#ECFDF5" font-size="12" font-weight="700">webrtcStreamEngine.ts (1390L)</text>
  <text x="596" y="570" fill="#A7F3D0" font-size="10.8">Full-Mesh RTCPeerConnection + Perfect Neg</text>
  <text x="596" y="584" fill="#A7F3D0" font-size="10.8">getDisplayMedia / Synthetic 720p Canvas</text>

  <rect x="46" y="604" width="250" height="56" rx="8" fill="#0B1914" stroke="#1F5944"/>
  <text x="58" y="623" fill="#ECFDF5" font-size="12" font-weight="700">systemMonitorAdapter.ts</text>
  <text x="58" y="640" fill="#A7F3D0" font-size="10.8">Tauri: sysinfo | Web: loop drift + heap</text>
  <text x="58" y="653" fill="#A7F3D0" font-size="10.8">+ WebRTC outbound/inbound getStats()</text>

  <rect x="312" y="604" width="256" height="56" rx="8" fill="#0B1914" stroke="#1F5944"/>
  <text x="324" y="623" fill="#ECFDF5" font-size="12" font-weight="700">telemetryAdapter.ts</text>
  <text x="324" y="640" fill="#A7F3D0" font-size="10.8">Consent-gated ('granted' only) GA4 MP</text>
  <text x="324" y="653" fill="#A7F3D0" font-size="10.8">+ window.__ELFY_TELEMETRY_EVENTS__</text>

  <rect x="584" y="604" width="248" height="56" rx="8" fill="#0B1914" stroke="#1F5944"/>
  <text x="596" y="623" fill="#ECFDF5" font-size="12" font-weight="700">localWindowBus.ts</text>
  <text x="596" y="640" fill="#A7F3D0" font-size="10.8">Tauri: emit/listen('elfy:local-window-bus')</text>
  <text x="596" y="653" fill="#A7F3D0" font-size="10.8">Web: BroadcastChannel + tabId echo filter</text>

  <!-- Arrow L2 -> L1 -->
  <line x1="438" y1="674" x2="438" y2="700" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Layer 1: Domain & Utilities -->
  <rect x="28" y="702" width="820" height="132" rx="12" fill="#261B12" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="46" y="725" fill="#FCD34D" font-size="13" font-weight="700">LAYER 1 · PURE DOMAIN, CONTRACTS &amp; UTILITIES  (src/domain/, src/utils/, src/data/)</text>

  <rect x="46" y="738" width="380" height="82" rx="8" fill="#18100A" stroke="#5E3E1A"/>
  <text x="58" y="758" fill="#FEF3C7" font-size="12" font-weight="700">Domain Core (Zero External Dependencies)</text>
  <text x="58" y="776" fill="#FDE68A" font-size="11">config.ts: ROOM_CONFIG (max 6), STREAM_CONFIG (60/30 FPS),</text>
  <text x="58" y="792" fill="#FDE68A" font-size="11">dtos.ts: UserProfile, FriendHub, Signaling/DataChannel/Bus DTOs</text>
  <text x="58" y="808" fill="#FDE68A" font-size="11">validators.ts: Strict runtime schema parsers + sanitizeHubCode</text>

  <rect x="442" y="738" width="390" height="82" rx="8" fill="#18100A" stroke="#5E3E1A"/>
  <text x="454" y="758" fill="#FEF3C7" font-size="12" font-weight="700">Shared Utilities &amp; Asset Catalog</text>
  <text x="454" y="776" fill="#FDE68A" font-size="11">hubTopics.ts (elfy/hub/&lt;id&gt;/*)  |  stun.ts (STUN + OpenRelay TURN)</text>
  <text x="454" y="792" fill="#FDE68A" font-size="11">notifications.ts (Web Audio chime + WinRT/Web Notification + dedup)</text>
  <text x="454" y="808" fill="#FDE68A" font-size="11">tauri.ts (isTauri, 21 IPC wrappers)  |  mockData.ts (avatars, aliases)</text>

  <!-- Layer 6 Sidebar: Native Rust Backend & External Services -->
  <rect x="870" y="102" width="302" height="482" rx="12" fill="#1D1226" stroke="#A855F7" stroke-width="1.5"/>
  <text x="888" y="126" fill="#E9D5FF" font-size="13" font-weight="700">LAYER 6 · NATIVE RUST BACKEND</text>
  <text x="888" y="143" fill="#C4B5FD" font-size="11.5">(src-tauri/src/ &amp; tauri.conf.json)</text>

  <rect x="888" y="158" width="266" height="162" rx="8" fill="#120B18" stroke="#4E2A70"/>
  <text x="900" y="178" fill="#F3E8FF" font-size="12.5" font-weight="700">lib.rs — App Runtime &amp; Tray</text>
  <text x="900" y="197" fill="#D8B4FE" font-size="10.8">- Single-instance temp lock file</text>
  <text x="900" y="213" fill="#D8B4FE" font-size="10.8">- 3 preloaded WebViews (main/stream/register)</text>
  <text x="900" y="229" fill="#D8B4FE" font-size="10.8">- System Tray + Blur auto-hide + drag guard</text>
  <text x="900" y="245" fill="#D8B4FE" font-size="10.8">- WinRT Toast + PS NotifyIcon fallback</text>
  <text x="900" y="261" fill="#D8B4FE" font-size="10.8">- HKCU AUMID registration + temp icon</text>
  <text x="900" y="277" fill="#D8B4FE" font-size="10.8">- 14 Window/App/Notify IPC commands</text>
  <text x="900" y="295" fill="#A78BFA" font-size="10.5">Events: request-start-stream, knock-toast-action</text>

  <rect x="888" y="332" width="266" height="122" rx="8" fill="#120B18" stroke="#4E2A70"/>
  <text x="900" y="352" fill="#F3E8FF" font-size="12.5" font-weight="700">db.rs — SQLite Persistence</text>
  <text x="900" y="371" fill="#D8B4FE" font-size="10.8">- elfy.sqlite (WAL + 5000ms busy_timeout)</text>
  <text x="900" y="387" fill="#D8B4FE" font-size="10.8">- SHA-256 machine UID -&gt; #10hex peer_tag</text>
  <text x="900" y="403" fill="#D8B4FE" font-size="10.8">- Tables: user_profile, friend_hubs</text>
  <text x="900" y="419" fill="#D8B4FE" font-size="10.8">- 6 db_* IPC commands (bundled rusqlite)</text>
  <text x="900" y="437" fill="#A78BFA" font-size="10.5">machine-uid plugin + capabilities/default.json</text>

  <rect x="888" y="466" width="266" height="102" rx="8" fill="#120B18" stroke="#4E2A70"/>
  <text x="900" y="486" fill="#F3E8FF" font-size="12.5" font-weight="700">system_monitor.rs — Telemetry</text>
  <text x="900" y="505" fill="#D8B4FE" font-size="10.8">- Global sysinfo::System OnceLock Mutex</text>
  <text x="900" y="521" fill="#D8B4FE" font-size="10.8">- Global CPU% + Used/Total RAM MB</text>
  <text x="900" y="537" fill="#D8B4FE" font-size="10.8">- High-load &gt;=80% CPU or &gt;=85% RAM</text>
  <text x="900" y="553" fill="#A78BFA" font-size="10.5">- 1 IPC command: get_system_metrics</text>

  <!-- External Network Box -->
  <rect x="870" y="602" width="302" height="232" rx="12" fill="#1E141D" stroke="#F472B6" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="888" y="626" fill="#F9A8D4" font-size="13" font-weight="700">EXTERNAL SERVICES &amp; PEERS</text>
  <rect x="888" y="640" width="266" height="44" rx="7" fill="#130B12" stroke="#5B2446"/>
  <text x="900" y="659" fill="#FCE7F3" font-size="11.5" font-weight="600">EMQX Public MQTT Broker</text>
  <text x="900" y="675" fill="#FBCFE8" font-size="10.5">wss://broker.emqx.io:8084/mqtt (QoS 1)</text>

  <rect x="888" y="694" width="266" height="44" rx="7" fill="#130B12" stroke="#5B2446"/>
  <text x="900" y="713" fill="#FCE7F3" font-size="11.5" font-weight="600">WebRTC ICE / Media P2P</text>
  <text x="900" y="729" fill="#FBCFE8" font-size="10.5">Google/Cloudflare STUN + OpenRelay TURN</text>

  <rect x="888" y="748" width="266" height="72" rx="7" fill="#130B12" stroke="#5B2446"/>
  <text x="900" y="767" fill="#FCE7F3" font-size="11.5" font-weight="600">Analytics &amp; Web Assets</text>
  <text x="900" y="783" fill="#FBCFE8" font-size="10.5">GA4: www.google-analytics.com/mp/collect</text>
  <text x="900" y="799" fill="#FBCFE8" font-size="10.5">Google Fonts CDN (Plus Jakarta Sans, Material)</text>

  <!-- Horizontal Bridge Arrows to Layer 6 & External -->
  <line x1="848" y1="560" x2="868" y2="560" stroke="#10B981" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <line x1="848" y1="640" x2="868" y2="640" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrowRose)"/>
</svg>
