<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14070D"/>
      <stop offset="100%" stop-color="#220D17"/>
    </linearGradient>
    <marker id="arwRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F43F5E"/>
    </marker>
    <marker id="arwCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arwEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arwAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1200" height="840" rx="18" fill="url(#bgGrad3)"/>

  <!-- Header -->
  <rect x="28" y="22" width="1144" height="58" rx="12" fill="#2A111C" stroke="#5B243A"/>
  <text x="48" y="48" fill="#FFEAF1" font-size="20" font-weight="700">Elfy — MQTT Signaling, Knock-to-Enter Gate &amp; Full-Mesh WebRTC Pipeline</text>
  <text x="48" y="68" fill="#D4A6B8" font-size="12.5">Wire Protocol v1 across wss://broker.emqx.io:8084/mqtt (QoS 1) + BroadcastChannel('elfy_test_signaling_bus') + WebRTC Mesh (max 6 concurrent peers)</text>

  <!-- Section 1: MQTT Topic Topology -->
  <rect x="28" y="96" width="1144" height="118" rx="12" fill="#13222F" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="48" y="121" fill="#7DD3FC" font-size="13.5" font-weight="700">1. CANONICAL HUB IDENTIFIER &amp; MQTT TOPIC TOPOLOGY  (src/utils/hubTopics.ts)</text>
  <text x="48" y="140" fill="#BAE6FD" font-size="11.5">Canonical Hub ID = toSafePeerTag('', peerTag) -&gt; 10-char lowercase alphanumeric SHA-256 tag (e.g. a1b2c3d4e5)</text>

  <rect x="48" y="152" width="348" height="48" rx="8" fill="#0B1620" stroke="#255473"/>
  <text x="60" y="171" fill="#E0F2FE" font-size="12" font-weight="700">elfy/hub/&lt;hubId&gt;/probe</text>
  <text x="60" y="188" fill="#93C5FD" font-size="10.8">Visitor -&gt; Host: hub_status_request (1500ms TTL)</text>

  <rect x="414" y="152" width="356" height="48" rx="8" fill="#0B1620" stroke="#255473"/>
  <text x="426" y="171" fill="#E0F2FE" font-size="12" font-weight="700">elfy/hub/&lt;hubId&gt;/knock</text>
  <text x="426" y="188" fill="#93C5FD" font-size="10.8">Guest -&gt; Host (+ Companion): knock_request</text>

  <rect x="788" y="152" width="364" height="48" rx="8" fill="#0B1620" stroke="#255473"/>
  <text x="800" y="171" fill="#E0F2FE" font-size="12" font-weight="700">elfy/hub/&lt;hubId&gt;/peer/&lt;peerIdSafe&gt;</text>
  <text x="800" y="188" fill="#93C5FD" font-size="10.8">Targeted Inbox: hub_status_response, knock_decision, webrtc_*</text>

  <!-- Swimlane Headers for Sequence -->
  <rect x="28" y="232" width="1144" height="398" rx="12" fill="#210F18" stroke="#5B243A" stroke-width="1.4"/>
  <text x="48" y="256" fill="#FF9BB3" font-size="13.5" font-weight="700">2. SESSION HANDSHAKE &amp; FULL-MESH MEDIA NEGOTIATION SEQUENCE</text>

  <!-- Actors -->
  <rect x="64" y="270" width="210" height="42" rx="8" fill="#2F1322" stroke="#F43F5E"/>
  <text x="169" y="295" text-anchor="middle" fill="#FFEAF1" font-size="12.5" font-weight="700">Guest A (Visitor)</text>
  <line x1="169" y1="312" x2="169" y2="616" stroke="#7F3550" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="374" y="270" width="210" height="42" rx="8" fill="#0F232E" stroke="#38BDF8"/>
  <text x="479" y="295" text-anchor="middle" fill="#E0F2FE" font-size="12.5" font-weight="700">MQTT Broker / Bus</text>
  <line x1="479" y1="312" x2="479" y2="616" stroke="#255473" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="684" y="270" width="210" height="42" rx="8" fill="#112921" stroke="#10B981"/>
  <text x="789" y="295" text-anchor="middle" fill="#ECFDF5" font-size="12.5" font-weight="700">Host (Owner Room / Tray)</text>
  <line x1="789" y1="312" x2="789" y2="616" stroke="#1F5944" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="944" y="270" width="204" height="42" rx="8" fill="#23142C" stroke="#C084FC"/>
  <text x="1046" y="295" text-anchor="middle" fill="#F5E8FF" font-size="12.5" font-weight="700">Existing Guest B</text>
  <line x1="1046" y1="312" x2="1046" y2="616" stroke="#532B5E" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Sequence Messages -->
  <!-- Step A: Probe -->
  <line x1="169" y1="336" x2="474" y2="336" stroke="#38BDF8" stroke-width="2" marker-end="url(#arwCyan)"/>
  <line x1="479" y1="336" x2="784" y2="336" stroke="#38BDF8" stroke-width="2" marker-end="url(#arwCyan)"/>
  <text x="324" y="328" text-anchor="middle" fill="#BAE6FD" font-size="11">hub_status_request -&gt; /probe</text>
  <line x1="789" y1="362" x2="484" y2="362" stroke="#38BDF8" stroke-width="2" marker-end="url(#arwCyan)"/>
  <line x1="479" y1="362" x2="174" y2="362" stroke="#38BDF8" stroke-width="2" marker-end="url(#arwCyan)"/>
  <text x="634" y="354" text-anchor="middle" fill="#BAE6FD" font-size="11">hub_status_response (status, peers, streamerNames)</text>

  <!-- Step B: Knock -->
  <line x1="169" y1="396" x2="474" y2="396" stroke="#F43F5E" stroke-width="2" marker-end="url(#arwRose)"/>
  <line x1="479" y1="396" x2="784" y2="396" stroke="#F43F5E" stroke-width="2" marker-end="url(#arwRose)"/>
  <text x="324" y="388" text-anchor="middle" fill="#FDA4AF" font-size="11" font-weight="600">knock_request -&gt; /knock (30s timeout; 1200ms dedup)</text>

  <rect x="650" y="408" width="278" height="36" rx="6" fill="#2A111C" stroke="#F59E0B"/>
  <text x="789" y="424" text-anchor="middle" fill="#FDE68A" font-size="10.8" font-weight="600">Host Gate: WinRT Toast / HostKnockAlert</text>
  <text x="789" y="438" text-anchor="middle" fill="#FCD34D" font-size="10">+ capacity check canAcceptMorePeers(&lt; 6)</text>

  <line x1="789" y1="464" x2="484" y2="464" stroke="#10B981" stroke-width="2" marker-end="url(#arwEmerald)"/>
  <line x1="479" y1="464" x2="174" y2="464" stroke="#10B981" stroke-width="2" marker-end="url(#arwEmerald)"/>
  <text x="634" y="456" text-anchor="middle" fill="#6EE7B7" font-size="11" font-weight="600">knock_decision (accepted, sessionToken, peerRoster[])</text>

  <!-- Step C: WebRTC Host <-> Guest A -->
  <line x1="789" y1="500" x2="484" y2="500" stroke="#F59E0B" stroke-width="2" marker-end="url(#arwAmber)"/>
  <line x1="479" y1="500" x2="174" y2="500" stroke="#F59E0B" stroke-width="2" marker-end="url(#arwAmber)"/>
  <text x="324" y="492" text-anchor="middle" fill="#FDE68A" font-size="11">webrtc_offer + webrtc_ice (creates 'elfy-control' DataChannel)</text>

  <line x1="169" y1="528" x2="474" y2="528" stroke="#F59E0B" stroke-width="2" marker-end="url(#arwAmber)"/>
  <line x1="479" y1="528" x2="784" y2="528" stroke="#F59E0B" stroke-width="2" marker-end="url(#arwAmber)"/>
  <text x="324" y="520" text-anchor="middle" fill="#FDE68A" font-size="11">webrtc_answer + webrtc_ice (STUN / OpenRelay TURN)</text>

  <!-- Step D: Guest A <-> Guest B Direct Mesh -->
  <line x1="789" y1="556" x2="1041" y2="556" stroke="#C084FC" stroke-width="2" marker-end="url(#arwCyan)"/>
  <text x="915" y="548" text-anchor="middle" fill="#E9D5FF" font-size="10.8">DataChannel peer_roster_sync (Guest A joined)</text>

  <line x1="169" y1="590" x2="1041" y2="590" stroke="#10B981" stroke-width="2.2" marker-start="url(#arwEmerald)" marker-end="url(#arwEmerald)"/>
  <text x="605" y="582" text-anchor="middle" fill="#6EE7B7" font-size="11" font-weight="600">Guest-Guest Mesh WebRTC + DataChannel (initiator = myId.localeCompare(peerId) &lt; 0)</text>

  <!-- Section 3: Engine Internals & DataChannel Protocol -->
  <rect x="28" y="646" width="560" height="172" rx="12" fill="#11241E" stroke="#10B981" stroke-width="1.5"/>
  <text x="46" y="670" fill="#6EE7B7" font-size="13" font-weight="700">3. WebRtcStreamEngine RESILIENCE &amp; CAPTURE</text>
  <text x="46" y="690" fill="#D1FAE5" font-size="11">- Per-peer serialized queue: enqueuePeerTask(peerId, fn)</text>
  <text x="46" y="707" fill="#D1FAE5" font-size="11">- Perfect Negotiation: localPeerIdSafe.localeCompare(remote) &gt; 0</text>
  <text x="46" y="724" fill="#D1FAE5" font-size="11">- ICE Buffering: pendingIce (remote) + pendingLocalIce + canEmitIce</text>
  <text x="46" y="741" fill="#D1FAE5" font-size="11">- Recovery: 3.5s offer re-emit, 5.5s stall warn, 8s host offer timer,</text>
  <text x="46" y="758" fill="#D1FAE5" font-size="11">  3.5s disconnect ICE restart (max 2 attempts)</text>
  <text x="46" y="775" fill="#D1FAE5" font-size="11">- Capture: getDisplayMedia() or Synthetic 1280x720 Canvas + 440Hz Tone</text>
  <text x="46" y="792" fill="#D1FAE5" font-size="11">- Dynamic FPS: 60 / 30 FPS switch via applyConstraints + setParameters</text>
  <text x="46" y="809" fill="#D1FAE5" font-size="11">- Keepalive: ping/pong every 2s; 4.5s silent -&gt; 3 missed -&gt; evict peer</text>

  <rect x="612" y="646" width="560" height="172" rx="12" fill="#261B12" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="630" y="670" fill="#FCD34D" font-size="13" font-weight="700">4. 'elfy-control' DATACHANNEL PAYLOADS  (src/domain/dtos.ts)</text>
  <text x="630" y="692" fill="#FDE68A" font-size="11">- stream_started / stream_stopped: displayName, avatar, resolution, fps (30|60)</text>
  <text x="630" y="711" fill="#FDE68A" font-size="11">- peer_roster_sync: authoritative RoomPeerDto[] snapshot from Host</text>
  <text x="630" y="730" fill="#FDE68A" font-size="11">- peer_profile_updated: propagates live displayName + avatarUrl edits</text>
  <text x="630" y="749" fill="#FDE68A" font-size="11">- renegotiate_offer / renegotiate_answer / renegotiate_ice: fast in-band</text>
  <text x="630" y="768" fill="#FDE68A" font-size="11">  WebRTC track/SDP renegotiation without hitting MQTT broker</text>
  <text x="630" y="787" fill="#FDE68A" font-size="11">- ping / pong: bidirectional heartbeat (sentAt / echoSentAt / respondedAt)</text>
  <text x="630" y="806" fill="#FDE68A" font-size="11">- peer_left: graceful peer departure &amp; mesh cleanup</text>
</svg>
